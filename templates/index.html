<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منشئ المستندات التعليمية</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        header {
            background: #17365d;
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        header p {
            margin: 0;
            font-size: 16px;
        }

        .container {
            max-width: 1100px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 3px 15px rgba(0,0,0,.07);
        }

        .card h2 {
            margin-top: 0;
            color: #17365d;
            font-size: 21px;
        }

        .step {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        select,
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd3dd;
            border-radius: 8px;
            font-size: 15px;
            background: white;
        }

        .stage-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .stage-buttons label {
            margin: 0;
            cursor: pointer;
        }

        .stage-buttons input {
            display: none;
        }

        .stage-buttons span {
            display: block;
            padding: 12px 25px;
            border: 2px solid #d5dce5;
            border-radius: 9px;
            background: white;
        }

        .stage-buttons input:checked + span {
            background: #17365d;
            color: white;
            border-color: #17365d;
        }

        .lessons-box {
            border: 1px solid #d8dee7;
            border-radius: 10px;
            padding: 15px;
            background: #fafbfd;
            min-height: 80px;
        }

        .unit {
            margin-bottom: 18px;
        }

        .unit-title {
            font-weight: bold;
            color: #17365d;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ddd;
        }

        .lesson-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: white;
            padding: 9px;
            margin-bottom: 7px;
            border-radius: 7px;
            border: 1px solid #e0e4ea;
        }

        .lesson-item input {
            width: 18px;
            height: 18px;
        }

        .counts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 12px;
        }

        .count-box {
            background: #f8fafc;
            padding: 12px;
            border-radius: 9px;
        }

        .count-box label {
            font-size: 14px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        button {
            border: 0;
            border-radius: 9px;
            padding: 13px 20px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .primary {
            background: #17365d;
            color: white;
        }

        .success {
            background: #198754;
            color: white;
        }

        .warning {
            background: #f0ad00;
            color: white;
        }

        .preview {
            display: none;
        }

        .student-line {
            margin: 20px 0;
            padding-bottom: 8px;
            border-bottom: 1px solid #aaa;
        }

        .question {
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .question-text {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #17365d;
            font-weight: bold;
        }

        .empty {
            color: #777;
            text-align: center;
            padding: 20px;
        }

        @media(max-width:600px) {
            header h1 {
                font-size: 22px;
            }

            .options {
                display: block;
            }

            .options div {
                margin-bottom: 7px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>منشئ المستندات التعليمية</h1>
    <p>المناهج التعليمية السعودية — العام الدراسي 1448-1449</p>
</header>

<div class="container">

    <div class="card">

        <h2>إعداد المستند</h2>

        <!-- المرحلة -->
        <div class="step">
            <label>1. اختر المرحلة التعليمية</label>

            <div class="stage-buttons">

                <label>
                    <input type="radio" name="stage" value="ابتدائي" onchange="stageChanged()">
                    <span>ابتدائي</span>
                </label>

                <label>
                    <input type="radio" name="stage" value="متوسط" onchange="stageChanged()">
                    <span>متوسط</span>
                </label>

                <label>
                    <input type="radio" name="stage" value="ثانوي" onchange="stageChanged()">
                    <span>ثانوي</span>
                </label>

            </div>
        </div>


        <!-- الصف -->
        <div class="step">
            <label for="grade">2. اختر الصف</label>

            <select id="grade" onchange="loadCurriculum()">
                <option value="">اختر المرحلة أولاً</option>
            </select>
        </div>


        <!-- الفصل -->
        <div class="step">

            <label for="term">3. اختر الفصل الدراسي</label>

            <select id="term" onchange="loadCurriculum()">

                <option value="">اختر الفصل الدراسي</option>

                <option value="الفصل الدراسي الأول">
                    الفصل الدراسي الأول
                </option>

                <option value="الفصل الدراسي الثاني">
                    الفصل الدراسي الثاني
                </option>

            </select>

        </div>


        <!-- المادة -->
        <div class="step">

            <label for="subject">4. اختر المادة</label>

            <select id="subject" onchange="loadCurriculum()">

                <option value="">اختر المادة</option>

            </select>

        </div>


        <!-- الوحدات والدروس -->
        <div class="step">

            <label>5. اختر الوحدات والدروس</label>

            <div id="lessonsBox" class="lessons-box">

                <div class="empty">
                    اختر الصف والفصل والمادة لعرض الوحدات والدروس
                </div>

            </div>

        </div>


        <!-- نوع المستند -->
        <div class="step">

            <label for="documentType">6. نوع المستند</label>

            <select id="documentType">

                <option>اختبار</option>
                <option>ورقة عمل</option>
                <option>مراجعة</option>
                <option>واجب</option>
                <option>أسئلة تدريبية</option>
                <option>نشاط تعليمي</option>
                <option>ملخص</option>

            </select>

        </div>

    </div>


    <!-- الأسئلة -->
    <div class="card">

        <h2>إعداد الأسئلة</h2>

        <div class="counts">

            <div class="count-box">
                <label>اختيار من متعدد</label>
                <input id="mcq" type="number" min="0" value="5">
            </div>

            <div class="count-box">
                <label>صح أو خطأ</label>
                <input id="tf" type="number" min="0" value="5">
            </div>

            <div class="count-box">
                <label>أكمل الفراغ</label>
                <input id="fill" type="number" min="0" value="5">
            </div>

            <div class="count-box">
                <label>توصيل بالمصطلح</label>
                <input id="match" type="number" min="0" value="5">
            </div>

            <div class="count-box">
                <label>توصيل بالصورة</label>
                <input id="imageMatch" type="number" min="0" value="0">
            </div>

        </div>

    </div>


    <!-- بيانات المعلم -->
    <div class="card">

        <h2>بيانات المستند</h2>

        <div class="step">
            <label>اسم المعلم / المعلمة</label>
            <input id="teacher" type="text">
        </div>

        <div class="step">
            <label>اسم المدرسة</label>
            <input id="school" type="text">
        </div>

        <div class="step">
            <label>عنوان المستند</label>
            <input id="title" type="text" value="مستند تعليمي">
        </div>

        <div class="buttons">

            <button class="primary" onclick="generateQuestions()">
                إنشاء الأسئلة
            </button>

        </div>

        <div id="loading" class="loading">
            جارٍ إنشاء الأسئلة...
        </div>

    </div>


    <!-- المعاينة -->
    <div id="previewCard" class="card preview">

        <h2>معاينة المستند</h2>

        <div id="preview"></div>

        <div class="buttons">

            <button class="success" onclick="exportDocument('pdf')">
                تصدير PDF
            </button>

            <button class="success" onclick="exportDocument('docx')">
                تصدير Word
            </button>

            <button class="warning" onclick="exportDocument('both')">
                PDF + Word
            </button>

        </div>

    </div>

</div>


<script>

const curriculumData = {{ data|tojson }};

let generatedQuestions = [];


/* تحميل الصفوف حسب المرحلة */
function stageChanged() {

    const stage =
        document.querySelector('input[name="stage"]:checked')?.value;

    const grade =
        document.getElementById('grade');

    grade.innerHTML =
        '<option value="">اختر الصف</option>';

    if (!stage) return;

    const grades =
        curriculumData.grades[stage] || [];

    grades.forEach(g => {

        const option =
            document.createElement('option');

        option.value = g;
        option.textContent = g;

        grade.appendChild(option);

    });

    document.getElementById('lessonsBox').innerHTML =
        '<div class="empty">اختر الصف والفصل والمادة</div>';
}


/* تحميل المواد */
function loadSubjects() {

    const subject =
        document.getElementById('subject');

    subject.innerHTML =
        '<option value="">اختر المادة</option>';

    const subjects =
        curriculumData.subjects || [];

    subjects.forEach(s => {

        const option =
            document.createElement('option');

        option.value = s;
        option.textContent = s;

        subject.appendChild(option);

    });
}


/* تحميل الوحدات والدروس */
function loadCurriculum() {

    const grade =
        document.getElementById('grade').value;

    const term =
        document.getElementById('term').value;

    const subject =
        document.getElementById('subject').value;

    const box =
        document.getElementById('lessonsBox');

    if (!grade || !term || !subject) {

        box.innerHTML =
            '<div class="empty">اختر الصف والفصل والمادة لعرض الوحدات والدروس</div>';

        return;
    }


    /*
      في هذه المرحلة لا توجد الوحدات والدروس
      داخل curriculum.json بعد.

      عند إضافتها لاحقاً سيقوم هذا الجزء
      بعرضها تلقائياً.
    */

    const curriculum =
        curriculumData.curriculum?.[grade]?.[subject]?.[term];

    if (!curriculum) {

        box.innerHTML = `
            <div class="empty">
                لم تتم إضافة الوحدات والدروس لهذه المادة بعد.
                <br>
                سيتم ربطها بالمناهج الرسمية في الخطوة التالية.
            </div>
        `;

        return;
    }


    box.innerHTML = '';


    Object.keys(curriculum).forEach(unitName => {

        const unit =
            document.createElement('div');

        unit.className = 'unit';

        const title =
            document.createElement('div');

        title.className = 'unit-title';

        title.textContent = unitName;

        unit.appendChild(title);


        curriculum[unitName].forEach((lesson, index) => {

            const row =
                document.createElement('label');

            row.className = 'lesson-item';

            row.innerHTML = `
                <input
                    type="checkbox"
                    class="lesson-check"
                    value="${lesson}"
                    data-unit="${unitName}"
                >
                <span>${lesson}</span>
            `;

            unit.appendChild(row);

        });


        box.appendChild(unit);

    });

}


/* إنشاء الأسئلة */
async function generateQuestions() {

    const stage =
        document.querySelector('input[name="stage"]:checked')?.value || '';

    const grade =
        document.getElementById('grade').value;

    const term =
        document.getElementById('term').value;

    const subject =
        document.getElementById('subject').value;


    const lessons =
        [...document.querySelectorAll('.lesson-check:checked')]
        .map(x => x.value);


    const counts = {

        mcq:
            Number(document.getElementById('mcq').value || 0),

        tf:
            Number(document.getElementById('tf').value || 0),

        fill:
            Number(document.getElementById('fill').value || 0),

        match:
            Number(document.getElementById('match').value || 0),

        imageMatch:
            Number(document.getElementById('imageMatch').value || 0)

    };


    if (!stage || !grade || !term || !subject) {

        alert('يرجى اختيار المرحلة والصف والفصل والمادة.');

        return;
    }


    if (lessons.length === 0) {

        alert('يرجى اختيار درس واحد على الأقل.');

        return;
    }


    document.getElementById('loading').style.display =
        'block';


    try {

        const response =
            await fetch('/api/generate', {

                method: 'POST',

                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify({

                    stage,
                    grade,
                    term,
                    subject,
                    lessons,
                    counts

                })

            });


        const data =
            await response.json();

        generatedQuestions =
            data.questions || [];


        showPreview(
            generatedQuestions,
            {
                stage,
                grade,
                term,
                subject
            }
        );


    } catch (error) {

        alert('حدث خطأ أثناء إنشاء الأسئلة.');

        console.error(error);

    }


    document.getElementById('loading').style.display =
        'none';

}


/* عرض المعاينة */
function showPreview(questions, meta) {

    const card =
        document.getElementById('previewCard');

    const preview =
        document.getElementById('preview');


    let html = '';

    html += `
        <h1 style="text-align:center">
            ${document.getElementById('title').value}
        </h1>

        <p>
            <strong>المرحلة:</strong> ${meta.stage}
            &nbsp;&nbsp;
            <strong>الصف:</strong> ${meta.grade}
        </p>

        <p>
            <strong>المادة:</strong> ${meta.subject}
            &nbsp;&nbsp;
            <strong>${meta.term}</strong>
        </p>

        <div class="student-line">
            اسم الطالب/ـة: ________________________________
        </div>
    `;


    questions.forEach(q => {

        html += `
            <div class="question">

                <div class="question-text">
                    ${q.n}. ${q.text}
                </div>
        `;


        if (q.options) {

            html += `<div class="options">`;

            q.options.forEach(option => {

                html += `
                    <div>${option}</div>
                `;

            });

            html += `</div>`;

        }


        html += `</div>`;

    });


    preview.innerHTML =
        html;

    card.style.display =
        'block';


    card.scrollIntoView({
        behavior: 'smooth'
    });

}


/* التصدير */
async function exportDocument(format) {

    if (!generatedQuestions.length) {

        alert('قم بإنشاء الأسئلة أولاً.');

        return;
    }


    const meta = {

        title:
            document.getElementById('title').value,

        stage:
            document.querySelector(
                'input[name="stage"]:checked'
            )?.value || '',

        grade:
            document.getElementById('grade').value,

        term:
            document.getElementById('term').value,

        subject:
            document.getElementById('subject').value,

        teacher:
            document.getElementById('teacher').value,

        school:
            document.getElementById('school').value

    };


    const response =
        await fetch('/api/export', {

            method: 'POST',

            headers: {
                'Content-Type': 'application/json'
            },

            body: JSON.stringify({

                questions:
                    generatedQuestions,

                meta,

                format

            })

        });


    const blob =
        await response.blob();

    const url =
        window.URL.createObjectURL(blob);

    const a =
        document.createElement('a');

    a.href = url;

    a.download =
        format === 'docx'
            ? 'المستند.docx'
            : format === 'pdf'
                ? 'المستند.pdf'
                : 'المستندات.zip';

    document.body.appendChild(a);

    a.click();

    a.remove();

    window.URL.revokeObjectURL(url);

}


/* تشغيل المواد عند فتح الصفحة */
loadSubjects();

</script>

</body>
</html>
