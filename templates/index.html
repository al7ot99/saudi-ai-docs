<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منشئ الاختبارات التعليمية</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#222} header{background:#17365d;color:#fff;padding:24px;text-align:center}.container{max-width:1100px;margin:24px auto;padding:0 15px}.card{background:#fff;border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:0 3px 15px rgba(0,0,0,.07)}h2{margin-top:0;color:#17365d}.step{margin-bottom:20px}label{display:block;font-weight:bold;margin-bottom:8px}select,input[type=text],input[type=number]{width:100%;padding:11px;border:1px solid #ccd3dd;border-radius:8px;font-size:15px}.stage-buttons,.types,.difficulty-grid{display:flex;gap:12px;flex-wrap:wrap}.stage-buttons input{display:none}.stage-buttons span{display:block;padding:11px 24px;border:2px solid #d5dce5;border-radius:9px;cursor:pointer}.stage-buttons input:checked+span{background:#17365d;color:#fff;border-color:#17365d}#trackStep{display:none}.lessons-box{border:1px solid #d8dee7;border-radius:10px;padding:15px;background:#fafbfd}.unit{margin-bottom:16px}.unit-title{font-weight:bold;color:#17365d;border-bottom:1px solid #ddd;padding-bottom:7px;margin-bottom:8px}.lesson-item,.type-item{display:flex;align-items:center;gap:8px;padding:8px;margin-bottom:6px;background:#fff;border:1px solid #e0e4ea;border-radius:7px}.lesson-item input,.type-item input{width:18px;height:18px}.mini{padding:7px 11px;border:1px solid #17365d;background:#fff;color:#17365d;border-radius:7px;cursor:pointer;margin:0 0 10px 6px}.difficulty-box{flex:1;min-width:180px;padding:16px;border-radius:10px;background:#f8fafc;border:1px solid #e1e6ed}.difficulty-box.easy{border-top:4px solid #198754}.difficulty-box.medium{border-top:4px solid #e0a800}.difficulty-box.hard{border-top:4px solid #c82333}.total{margin-top:14px;padding:12px;background:#eef4fb;border-radius:8px;font-weight:bold;text-align:center;font-size:17px}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button{border:0;border-radius:9px;padding:13px 20px;cursor:pointer;font-weight:bold}.primary{background:#17365d;color:#fff}.success{background:#198754;color:#fff}.warning{background:#e0a800;color:#fff}.preview{display:none}.preview-title{text-align:center}.info{padding:9px;background:#f8fafc;border:1px solid #ddd;border-radius:7px;font-weight:bold}.student{padding:10px 0 15px;font-weight:bold}.question{padding:14px 0;border-bottom:1px solid #eee}.question-text{font-weight:bold;margin-bottom:10px}.options{display:flex;gap:18px;flex-wrap:wrap}.loading{display:none;text-align:center;padding:18px;font-weight:bold;color:#17365d}.empty{color:#777;text-align:center;padding:15px}@media(max-width:700px){.difficulty-grid,.stage-buttons{display:grid;grid-template-columns:1fr}.buttons button{width:100%}.options{display:block}}
</style>
</head>
<body>
<header><h1>منشئ الاختبارات التعليمية</h1><p>بنك أسئلة المناهج السعودية 1448-1449</p></header>
<div class="container">
<div class="card"><h2>1. اختيار المنهج والدروس</h2>
<div class="step"><label>المرحلة التعليمية</label><div class="stage-buttons"><label><input type="radio" name="stage" value="ابتدائي" onchange="stageChanged()"><span>ابتدائي</span></label><label><input type="radio" name="stage" value="متوسط" onchange="stageChanged()"><span>متوسط</span></label><label><input type="radio" name="stage" value="ثانوي" onchange="stageChanged()"><span>ثانوي</span></label></div></div>
<div class="step"><label>الصف</label><select id="grade" onchange="gradeChanged()"><option value="">اختر المرحلة أولاً</option></select></div>
<div class="step" id="trackStep"><label>المسار</label><select id="track" onchange="trackChanged()"><option value="">اختر المسار</option><option>المسار العام</option><option>مسار علوم الحاسب والهندسة</option><option>مسار الصحة والحياة</option><option>مسار إدارة الأعمال</option><option>المسار الشرعي</option></select></div>
<div class="step"><label>الفصل الدراسي</label><select id="term" onchange="termChanged()"><option value="">اختر الفصل</option><option>الفصل الدراسي الأول</option><option>الفصل الدراسي الثاني</option></select></div>
<div class="step"><label>المادة</label><select id="subject" onchange="loadCurriculum()"><option value="">اختر المادة</option></select></div>
<div class="step"><label>الدروس</label><div id="lessonsBox" class="lessons-box"><div class="empty">اختر الصف والفصل والمادة</div></div></div>
</div>
<div class="card"><h2>2. مستوى الصعوبة</h2><div class="difficulty-grid"><div class="difficulty-box easy"><label>🟢 سهل</label><input id="easy" type="number" min="0" max="100" value="5" oninput="updateTotal()"></div><div class="difficulty-box medium"><label>🟡 متوسط</label><input id="medium" type="number" min="0" max="100" value="5" oninput="updateTotal()"></div><div class="difficulty-box hard"><label>🔴 صعب</label><input id="hard" type="number" min="0" max="100" value="2" oninput="updateTotal()"></div></div><div class="total">إجمالي الأسئلة: <span id="totalQuestions">12</span></div></div>
<div class="card"><h2>3. أنواع الأسئلة</h2><div class="types"><label class="type-item"><input class="question-type" type="checkbox" value="mcq" checked> اختيار من متعدد</label><label class="type-item"><input class="question-type" type="checkbox" value="tf" checked> صح أو خطأ</label><label class="type-item"><input class="question-type" type="checkbox" value="fill" checked> أكمل الفراغ</label><label class="type-item"><input class="question-type" type="checkbox" value="match"> توصيل</label></div></div>
<div class="card"><h2>4. بيانات المستند</h2><div class="step"><label>نوع المستند</label><select id="documentType"><option>اختبار</option><option>ورقة عمل</option><option>مراجعة</option><option>واجب</option><option>أسئلة تدريبية</option></select></div><div class="step"><label>اسم المعلم / المعلمة</label><input id="teacher" type="text"></div><div class="step"><label>اسم المدرسة</label><input id="school" type="text"></div><div class="step"><label>عنوان المستند</label><input id="title" type="text" value="اختبار"></div><div class="buttons"><button class="primary" onclick="generateQuestions()">إنشاء الاختبار</button></div><div id="loading" class="loading">جارٍ اختيار الأسئلة من بنك الأسئلة...</div></div>
<div id="previewCard" class="card preview"><h2>معاينة المستند</h2><div id="preview"></div><div class="buttons"><button class="success" onclick="exportDocument('pdf')">تصدير PDF</button><button class="success" onclick="exportDocument('docx')">تصدير Word</button><button class="warning" onclick="exportDocument('both')">PDF + Word</button></div></div>
</div>
<script>
const curriculumData={{ data|tojson }}; let generatedQuestions=[];
function getStage(){return document.querySelector('input[name="stage"]:checked')?.value||''}
function isTrackGrade(g){return ['السنة الثانية','السنة الثالثة','ثاني ثانوي','ثالث ثانوي'].includes(g)}
function cleanSubjectName(s){return String(s||'').replace(' - مسار علوم الحاسب والهندسة','').replace(' - مسار الصحة والحياة','').replace(' - مسار إدارة الأعمال','').replace(' - المسار الشرعي','').replace(' - المسار العام','').trim()}
function resetLessons(t='اختر الصف والفصل والمادة'){document.getElementById('lessonsBox').innerHTML=`<div class="empty">${t}</div>`}
function stageChanged(){const s=getStage(),g=document.getElementById('grade');g.innerHTML='<option value="">اختر الصف</option>';(curriculumData.grades?.[s]||[]).forEach(x=>g.add(new Option(x,x)));document.getElementById('trackStep').style.display='none';document.getElementById('subject').innerHTML='<option value="">اختر المادة</option>';resetLessons()}
function gradeChanged(){const g=document.getElementById('grade').value;document.getElementById('track').value='';document.getElementById('trackStep').style.display=(getStage()==='ثانوي'&&isTrackGrade(g))?'block':'none';loadSubjects();resetLessons()}
function trackChanged(){loadSubjects();resetLessons()}
function termChanged(){loadSubjects();resetLessons()}
function gradeData(){return curriculumData.curriculum?.[document.getElementById('grade').value]||null}
function selectedData(){let d=gradeData(),g=document.getElementById('grade').value,t=document.getElementById('track').value;if(d&&isTrackGrade(g)&&t&&d[t])d=d[t];return d}
function loadSubjects(){const sel=document.getElementById('subject'),g=document.getElementById('grade').value,t=document.getElementById('track').value;sel.innerHTML='<option value="">اختر المادة</option>';if(!g)return;if(getStage()==='ثانوي'&&isTrackGrade(g)&&!t)return;const d=selectedData();if(d)Object.keys(d).forEach(s=>sel.add(new Option(cleanSubjectName(s),s)))}
function subjectData(){const d=selectedData(),s=document.getElementById('subject').value;return d?.[s]||null}
function loadCurriculum(){const term=document.getElementById('term').value,s=document.getElementById('subject').value;if(!term||!s){resetLessons();return}const cur=subjectData()?.[term];if(!cur){resetLessons('لا توجد دروس مضافة لهذا الاختيار.');return}const box=document.getElementById('lessonsBox');box.innerHTML='<button type="button" class="mini" onclick="toggleLessons(true)">اختيار الكل</button><button type="button" class="mini" onclick="toggleLessons(false)">إلغاء الكل</button>';Object.entries(cur).forEach(([unit,lessons])=>{const div=document.createElement('div');div.className='unit';div.innerHTML=`<div class="unit-title">${escapeHtml(unit)}</div>`;(lessons||[]).forEach(l=>{const row=document.createElement('label');row.className='lesson-item';row.innerHTML=`<input type="checkbox" class="lesson-check" value="${escapeAttr(l)}" data-unit="${escapeAttr(unit)}"><span>${escapeHtml(l)}</span>`;div.appendChild(row)});box.appendChild(div)})}
function toggleLessons(v){document.querySelectorAll('.lesson-check').forEach(x=>x.checked=v)}
function updateTotal(){const n=['easy','medium','hard'].reduce((a,id)=>a+Math.max(0,Number(document.getElementById(id).value||0)),0);document.getElementById('totalQuestions').textContent=n}
function selectedTypes(){return [...document.querySelectorAll('.question-type:checked')].map(x=>x.value)}
async function generateQuestions(){const lessons=[...document.querySelectorAll('.lesson-check:checked')].map(x=>x.value);const payload={stage:getStage(),grade:document.getElementById('grade').value,track:document.getElementById('track').value,term:document.getElementById('term').value,subject:document.getElementById('subject').value,documentType:document.getElementById('documentType').value,lessons,types:selectedTypes(),difficulties:{easy:Number(document.getElementById('easy').value||0),medium:Number(document.getElementById('medium').value||0),hard:Number(document.getElementById('hard').value||0)}};if(!payload.stage||!payload.grade||!payload.term||!payload.subject){alert('أكمل اختيار المرحلة والصف والفصل والمادة.');return}if(!lessons.length){alert('اختر درساً واحداً على الأقل.');return}if(!payload.types.length){alert('اختر نوعاً واحداً على الأقل من الأسئلة.');return}const loading=document.getElementById('loading');loading.style.display='block';try{const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'فشل إنشاء الاختبار');generatedQuestions=d.questions||[];showPreview(generatedQuestions,payload)}catch(e){alert(e.message)}finally{loading.style.display='none'}}
function stripPrefix(x){return String(x||'').replace(/^\s*(?:[1-4١-٤]|[أبجد])\s*[.\-):]\s*/u,'').trim()}
function showPreview(qs,m){const p=document.getElementById('preview');const teacher=document.getElementById('teacher').value.trim()||'—';let h=`<h1 class="preview-title">${escapeHtml(document.getElementById('title').value||'اختبار')}</h1><div class="info">المادة: ${escapeHtml(cleanSubjectName(m.subject))} &nbsp; | &nbsp; الصف: ${escapeHtml(m.grade)} &nbsp; | &nbsp; الفصل الدراسي: ${escapeHtml(String(m.term).replace('الفصل الدراسي ',''))} &nbsp; | &nbsp; المعلم: ${escapeHtml(teacher)}</div><div class="student">اسم الطالب/ـة: ______________________________</div>`;qs.forEach((q,i)=>{h+=`<div class="question"><div class="question-text">${q.n||i+1}. ${escapeHtml(q.text)}</div>`;if(q.options?.length){h+='<div class="options">';if(q.type==='اختيار من متعدد'||q.typeKey==='mcq')q.options.slice(0,4).forEach((o,j)=>h+=`<div><b>${j+1}.</b> ${escapeHtml(stripPrefix(o))}</div>`);else q.options.forEach(o=>h+=`<div>${escapeHtml(o)}</div>`);h+='</div>'}h+='</div>'});p.innerHTML=h;document.getElementById('previewCard').style.display='block';document.getElementById('previewCard').scrollIntoView({behavior:'smooth'})}
function escapeHtml(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function escapeAttr(v){return escapeHtml(v)}
async function exportDocument(format){if(!generatedQuestions.length){alert('أنشئ الاختبار أولاً.');return}const meta={title:document.getElementById('title').value,documentType:document.getElementById('documentType').value,stage:getStage(),grade:document.getElementById('grade').value,track:document.getElementById('track').value,term:document.getElementById('term').value,subject:cleanSubjectName(document.getElementById('subject').value),teacher:document.getElementById('teacher').value,school:document.getElementById('school').value};try{const r=await fetch('/api/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({questions:generatedQuestions,meta,format})});if(!r.ok){let msg='فشل التصدير';try{const d=await r.json();msg=d.error||msg}catch{}throw new Error(msg)}const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=format==='docx'?'المستند.docx':format==='pdf'?'المستند.pdf':'المستندات.zip';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}catch(e){alert(e.message)}}
updateTotal();
</script>
</body></html>
