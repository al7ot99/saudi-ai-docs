<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>منشئ المستندات التعليمية</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        header {
            background: #17365d;
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        header p {
            margin: 0;
            font-size: 16px;
        }

        .container {
            max-width: 1100px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .card {
            background: white;
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 3px 15px rgba(0,0,0,.07);
        }

        .card h2 {
            margin-top: 0;
            color: #17365d;
            font-size: 21px;
        }

        .step {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        select,
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd3dd;
            border-radius: 8px;
            font-size: 15px;
            background: white;
        }

        select:focus,
        input:focus {
            outline: none;
            border-color: #17365d;
        }

        .stage-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .stage-buttons label {
            margin: 0;
            cursor: pointer;
        }

        .stage-buttons input {
            display: none;
        }

        .stage-buttons span {
            display: block;
            padding: 12px 25px;
            border: 2px solid #d5dce5;
            border-radius: 9px;
            background: white;
        }

        .stage-buttons input:checked + span {
            background: #17365d;
            color: white;
            border-color: #17365d;
        }

        #trackStep {
            display: none;
            padding: 15px;
            border-radius: 10px;
            background: #f3f7fc;
            border: 1px solid #d8e2ef;
        }

        .lessons-box {
            border: 1px solid #d8dee7;
            border-radius: 10px;
            padding: 15px;
            background: #fafbfd;
            min-height: 80px;
        }

        .unit {
            margin-bottom: 18px;
        }

        .unit:last-child {
            margin-bottom: 0;
        }

        .unit-title {
            font-weight: bold;
            color: #17365d;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px solid #ddd;
        }

        .lesson-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: white;
            padding: 9px;
            margin-bottom: 7px;
            border-radius: 7px;
            border: 1px solid #e0e4ea;
            cursor: pointer;
        }

        .lesson-item:hover {
            background: #f5f8fc;
        }

        .lesson-item input {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .select-tools {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .mini-button {
            border: 1px solid #17365d;
            background: white;
            color: #17365d;
            padding: 8px 12px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 13px;
        }

        .mini-button:hover {
            background: #17365d;
            color: white;
        }

        .counts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 12px;
        }

        .count-box {
            background: #f8fafc;
            padding: 12px;
            border-radius: 9px;
        }

        .count-box label {
            font-size: 14px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        button {
            border: 0;
            border-radius: 9px;
            padding: 13px 20px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .primary {
            background: #17365d;
            color: white;
        }

        .success {
            background: #198754;
            color: white;
        }

        .warning {
            background: #f0ad00;
            color: white;
        }

        button:hover {
            opacity: .92;
        }

        .preview {
            display: none;
        }

        .student-line {
            margin: 20px 0;
            padding-bottom: 8px;
            border-bottom: 1px solid #aaa;
        }

        .question {
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .question-text {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .options {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #17365d;
            font-weight: bold;
        }

        .empty {
            color: #777;
            text-align: center;
            padding: 20px;
        }

        .track-note {
            color: #666;
            font-size: 13px;
            margin-top: 7px;
        }

        @media(max-width:600px) {

            header h1 {
                font-size: 22px;
            }

            .options {
                display: block;
            }

            .options div {
                margin-bottom: 7px;
            }

            .stage-buttons {
                display: grid;
                grid-template-columns: 1fr;
            }

            .stage-buttons span {
                text-align: center;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>منشئ المستندات التعليمية</h1>
    <p>المناهج التعليمية السعودية — العام الدراسي 1448-1449</p>
</header>


<div class="container">

    <!-- إعداد المستند -->
    <div class="card">

        <h2>إعداد المستند</h2>


        <!-- المرحلة -->
        <div class="step">

            <label>1. اختر المرحلة التعليمية</label>

            <div class="stage-buttons">

                <label>
                    <input
                        type="radio"
                        name="stage"
                        value="ابتدائي"
                        onchange="stageChanged()"
                    >
                    <span>ابتدائي</span>
                </label>

                <label>
                    <input
                        type="radio"
                        name="stage"
                        value="متوسط"
                        onchange="stageChanged()"
                    >
                    <span>متوسط</span>
                </label>

                <label>
                    <input
                        type="radio"
                        name="stage"
                        value="ثانوي"
                        onchange="stageChanged()"
                    >
                    <span>ثانوي</span>
                </label>

            </div>

        </div>


        <!-- الصف -->
        <div class="step">

            <label for="grade">
                2. اختر الصف
            </label>

            <select
                id="grade"
                onchange="gradeChanged()"
            >

                <option value="">
                    اختر المرحلة أولاً
                </option>

            </select>

        </div>


        <!-- المسار -->
        <div
            class="step"
            id="trackStep"
        >

            <label for="track">
                3. اختر المسار
            </label>

            <select
                id="track"
                onchange="trackChanged()"
            >

                <option value="">
                    اختر المسار
                </option>

                <option value="المسار العام">
                    المسار العام
                </option>

                <option value="مسار علوم الحاسب والهندسة">
                    مسار علوم الحاسب والهندسة
                </option>

                <option value="مسار الصحة والحياة">
                    مسار الصحة والحياة
                </option>

                <option value="مسار إدارة الأعمال">
                    مسار إدارة الأعمال
                </option>

                <option value="المسار الشرعي">
                    المسار الشرعي
                </option>

            </select>

            <div class="track-note">
                يظهر اختيار المسار في السنة الثانية والثالثة الثانوية فقط.
            </div>

        </div>


        <!-- الفصل -->
        <div class="step">

            <label for="term">
                الفصل الدراسي
            </label>

            <select
                id="term"
                onchange="termChanged()"
            >

                <option value="">
                    اختر الفصل الدراسي
                </option>

                <option value="الفصل الدراسي الأول">
                    الفصل الدراسي الأول
                </option>

                <option value="الفصل الدراسي الثاني">
                    الفصل الدراسي الثاني
                </option>

            </select>

        </div>


        <!-- المادة -->
        <div class="step">

            <label for="subject">
                المادة
            </label>

            <select
                id="subject"
                onchange="subjectChanged()"
            >

                <option value="">
                    اختر المادة
                </option>

            </select>

        </div>


        <!-- الوحدات والدروس -->
        <div class="step">

            <label>
                اختر الوحدات والدروس
            </label>

            <div
                id="lessonsBox"
                class="lessons-box"
            >

                <div class="empty">
                    اختر المرحلة والصف والفصل والمادة لعرض الوحدات والدروس
                </div>

            </div>

        </div>


        <!-- نوع المستند -->
        <div class="step">

            <label for="documentType">
                نوع المستند
            </label>

            <select id="documentType">

                <option value="اختبار">
                    اختبار
                </option>

                <option value="ورقة عمل">
                    ورقة عمل
                </option>

                <option value="مراجعة">
                    مراجعة
                </option>

                <option value="واجب">
                    واجب
                </option>

                <option value="أسئلة تدريبية">
                    أسئلة تدريبية
                </option>

                <option value="نشاط تعليمي">
                    نشاط تعليمي
                </option>

                <option value="ملخص">
                    ملخص
                </option>

            </select>

        </div>

    </div>



    <!-- إعداد الأسئلة -->
    <div class="card">

        <h2>إعداد الأسئلة</h2>

        <div class="counts">

            <div class="count-box">
                <label>اختيار من متعدد</label>
                <input
                    id="mcq"
                    type="number"
                    min="0"
                    value="5"
                >
            </div>

            <div class="count-box">
                <label>صح أو خطأ</label>
                <input
                    id="tf"
                    type="number"
                    min="0"
                    value="5"
                >
            </div>

            <div class="count-box">
                <label>أكمل الفراغ</label>
                <input
                    id="fill"
                    type="number"
                    min="0"
                    value="5"
                >
            </div>

            <div class="count-box">
                <label>توصيل بالمصطلح</label>
                <input
                    id="match"
                    type="number"
                    min="0"
                    value="5"
                >
            </div>

            <div class="count-box">
                <label>توصيل بالصورة</label>
                <input
                    id="imageMatch"
                    type="number"
                    min="0"
                    value="0"
                >
            </div>

        </div>

    </div>



    <!-- بيانات المستند -->
    <div class="card">

        <h2>بيانات المستند</h2>

        <div class="step">

            <label>
                اسم المعلم / المعلمة
            </label>

            <input
                id="teacher"
                type="text"
            >

        </div>


        <div class="step">

            <label>
                اسم المدرسة
            </label>

            <input
                id="school"
                type="text"
            >

        </div>


        <div class="step">

            <label>
                عنوان المستند
            </label>

            <input
                id="title"
                type="text"
                value="مستند تعليمي"
            >

        </div>


        <div class="buttons">

            <button
                class="primary"
                onclick="generateQuestions()"
            >
                إنشاء الأسئلة
            </button>

        </div>


        <div
            id="loading"
            class="loading"
        >
            جارٍ إنشاء الأسئلة...
        </div>

    </div>



    <!-- المعاينة -->
    <div
        id="previewCard"
        class="card preview"
    >

        <h2>معاينة المستند</h2>

        <div id="preview"></div>

        <div class="buttons">

            <button
                class="success"
                onclick="exportDocument('pdf')"
            >
                تصدير PDF
            </button>

            <button
                class="success"
                onclick="exportDocument('docx')"
            >
                تصدير Word
            </button>

            <button
                class="warning"
                onclick="exportDocument('both')"
            >
                PDF + Word
            </button>

        </div>

    </div>

</div>



<script>

const curriculumData = {{ data|tojson }};

let generatedQuestions = [];


/* ==========================================
   أدوات عامة
========================================== */

function getStage() {

    return document.querySelector(
        'input[name="stage"]:checked'
    )?.value || '';

}


function isSecondaryTrackGrade(grade) {

    return (
        grade === 'السنة الثانية' ||
        grade === 'السنة الثالثة' ||
        grade === 'ثاني ثانوي' ||
        grade === 'ثالث ثانوي'
    );

}


function resetLessons(message) {

    document.getElementById('lessonsBox').innerHTML = `
        <div class="empty">
            ${message || 'اختر الصف والفصل والمادة لعرض الوحدات والدروس'}
        </div>
    `;

}


function resetSubject() {

    document.getElementById('subject').innerHTML =
        '<option value="">اختر المادة</option>';

}


function getGradeData() {

    const grade =
        document.getElementById('grade').value;

    if (!grade) {
        return null;
    }

    return curriculumData.curriculum?.[grade] || null;

}


/* ==========================================
   تغيير المرحلة
========================================== */

function stageChanged() {

    const stage = getStage();

    const gradeSelect =
        document.getElementById('grade');

    const track =
        document.getElementById('track');

    gradeSelect.innerHTML =
        '<option value="">اختر الصف</option>';

    track.value = '';

    document.getElementById('trackStep').style.display =
        'none';

    resetSubject();

    resetLessons(
        'اختر الصف والفصل والمادة لعرض الوحدات والدروس'
    );


    if (!stage) {
        return;
    }


    const grades =
        curriculumData.grades?.[stage] || [];


    grades.forEach(gradeName => {

        const option =
            document.createElement('option');

        option.value = gradeName;

        option.textContent = gradeName;

        gradeSelect.appendChild(option);

    });

}


/* ==========================================
   تغيير الصف
========================================== */

function gradeChanged() {

    const stage =
        getStage();

    const grade =
        document.getElementById('grade').value;

    const trackStep =
        document.getElementById('trackStep');

    const track =
        document.getElementById('track');


    track.value = '';

    resetSubject();

    resetLessons(
        'اختر الفصل والمادة لعرض الوحدات والدروس'
    );


    if (
        stage === 'ثانوي' &&
        isSecondaryTrackGrade(grade)
    ) {

        trackStep.style.display = 'block';

    } else {

        trackStep.style.display = 'none';

    }


    loadSubjects();

}


/* ==========================================
   تغيير المسار
========================================== */

function trackChanged() {

    resetSubject();

    resetLessons(
        'اختر المادة لعرض الوحدات والدروس'
    );

    loadSubjects();

}


/* ==========================================
   تغيير الفصل
========================================== */

function termChanged() {

    resetSubject();

    resetLessons(
        'اختر المادة لعرض الوحدات والدروس'
    );

    loadSubjects();

}


/* ==========================================
   تغيير المادة
========================================== */

function subjectChanged() {

    loadCurriculum();

}


/* ==========================================
   الوصول إلى بيانات المسار
========================================== */

function getSelectedTrackData() {

    const grade =
        document.getElementById('grade').value;

    const track =
        document.getElementById('track').value;

    const gradeData =
        getGradeData();


    if (!gradeData) {
        return null;
    }


    /*
      إذا كان curriculum.json مبنياً بالطريقة الجديدة:

      السنة الثانية
          -> المسار العام
              -> المواد
    */

    if (
        isSecondaryTrackGrade(grade) &&
        track &&
        gradeData[track] &&
        typeof gradeData[track] === 'object'
    ) {

        return gradeData[track];

    }


    /*
      دعم البنية القديمة أيضاً إذا كانت المواد
      موجودة مباشرة داخل السنة.
    */

    return gradeData;

}


/* ==========================================
   تحديد ما إذا كانت المادة تابعة لمسار آخر
========================================== */

function belongsToAnotherTrack(subjectName, selectedTrack) {

    const trackNames = [
        'المسار العام',
        'مسار علوم الحاسب والهندسة',
        'مسار الصحة والحياة',
        'مسار إدارة الأعمال',
        'المسار الشرعي'
    ];


    const mentionedTrack =
        trackNames.find(trackName =>
            subjectName.includes(trackName)
        );


    if (!mentionedTrack) {
        return false;
    }


    return mentionedTrack !== selectedTrack;

}


/* ==========================================
   تنسيق اسم المادة للعرض
========================================== */

function cleanSubjectName(subjectName) {

    return subjectName
        .replace(' - مسار علوم الحاسب والهندسة', '')
        .replace(' - مسار الصحة والحياة', '')
        .replace(' - مسار إدارة الأعمال', '')
        .replace(' - المسار الشرعي', '')
        .replace(' - المسار العام', '')
        .trim();

}


/* ==========================================
   تحميل المواد
========================================== */

function loadSubjects() {

    const stage =
        getStage();

    const grade =
        document.getElementById('grade').value;

    const term =
        document.getElementById('term').value;

    const track =
        document.getElementById('track').value;

    const subjectSelect =
        document.getElementById('subject');


    subjectSelect.innerHTML =
        '<option value="">اختر المادة</option>';


    if (!grade) {
        return;
    }


    /*
      السنة الثانية والثالثة الثانوية
      يجب اختيار المسار أولاً.
    */

    if (
        stage === 'ثانوي' &&
        isSecondaryTrackGrade(grade) &&
        !track
    ) {

        return;

    }


    const subjectData =
        getSelectedTrackData();


    /*
      الطريقة الأفضل:
      نستخرج المواد الموجودة فعلياً داخل curriculum.
    */

    if (
        subjectData &&
        typeof subjectData === 'object'
    ) {

        const subjectNames =
            Object.keys(subjectData);


        subjectNames.forEach(subjectName => {

            /*
              في حالة استخدام بنية البيانات القديمة،
              نخفي المواد التي تحمل اسم مسار آخر.
            */

            if (
                stage === 'ثانوي' &&
                isSecondaryTrackGrade(grade) &&
                track &&
                belongsToAnotherTrack(subjectName, track)
            ) {

                return;

            }


            const value =
                subjectName;

            const label =
                cleanSubjectName(subjectName);


            const option =
                document.createElement('option');

            option.value = value;

            option.textContent = label;

            subjectSelect.appendChild(option);

        });


        return;

    }


    /*
      دعم النظام القديم الذي يستخدم
      curriculumData.subjects
    */

    const subjects =
        curriculumData.subjects || [];


    subjects.forEach(subjectName => {

        const option =
            document.createElement('option');

        option.value = subjectName;

        option.textContent = subjectName;

        subjectSelect.appendChild(option);

    });

}


/* ==========================================
   جلب بيانات المادة
========================================== */

function getSubjectData() {

    const grade =
        document.getElementById('grade').value;

    const track =
        document.getElementById('track').value;

    const subject =
        document.getElementById('subject').value;

    const gradeData =
        getGradeData();


    if (
        !gradeData ||
        !subject
    ) {

        return null;

    }


    /*
      البنية الجديدة للثانوية:
      الصف -> المسار -> المادة
    */

    if (
        isSecondaryTrackGrade(grade) &&
        track &&
        gradeData[track] &&
        gradeData[track][subject]
    ) {

        return gradeData[track][subject];

    }


    /*
      البنية القديمة:
      الصف -> المادة
    */

    return gradeData[subject] || null;

}


/* ==========================================
   تحميل الوحدات والدروس
========================================== */

function loadCurriculum() {

    const stage =
        getStage();

    const grade =
        document.getElementById('grade').value;

    const track =
        document.getElementById('track').value;

    const term =
        document.getElementById('term').value;

    const subject =
        document.getElementById('subject').value;

    const box =
        document.getElementById('lessonsBox');


    if (!grade) {

        resetLessons(
            'اختر الصف أولاً'
        );

        return;

    }


    if (
        stage === 'ثانوي' &&
        isSecondaryTrackGrade(grade) &&
        !track
    ) {

        resetLessons(
            'اختر المسار أولاً'
        );

        return;

    }


    if (!term || !subject) {

        resetLessons(
            'اختر الفصل والمادة لعرض الوحدات والدروس'
        );

        return;

    }


    const subjectData =
        getSubjectData();


    if (!subjectData) {

        resetLessons(
            'لم تتم إضافة بيانات هذه المادة بعد.'
        );

        return;

    }


    const curriculum =
        subjectData[term];


    if (!curriculum) {

        resetLessons(
            'لم تتم إضافة الوحدات والدروس لهذا الفصل الدراسي بعد.'
        );

        return;

    }


    box.innerHTML = '';


    /*
      أزرار اختيار الكل وإلغاء الكل
    */

    const tools =
        document.createElement('div');

    tools.className =
        'select-tools';


    const selectAllButton =
        document.createElement('button');

    selectAllButton.type =
        'button';

    selectAllButton.className =
        'mini-button';

    selectAllButton.textContent =
        'اختيار جميع الدروس';

    selectAllButton.onclick =
        function () {

            document
                .querySelectorAll('.lesson-check')
                .forEach(item => {

                    item.checked = true;

                });

        };


    const clearAllButton =
        document.createElement('button');

    clearAllButton.type =
        'button';

    clearAllButton.className =
        'mini-button';

    clearAllButton.textContent =
        'إلغاء اختيار الكل';

    clearAllButton.onclick =
        function () {

            document
                .querySelectorAll('.lesson-check')
                .forEach(item => {

                    item.checked = false;

                });

        };


    tools.appendChild(selectAllButton);

    tools.appendChild(clearAllButton);

    box.appendChild(tools);


    /*
      عرض الوحدات والدروس
    */

    Object.keys(curriculum).forEach(unitName => {

        const lessons =
            curriculum[unitName];


        const unit =
            document.createElement('div');

        unit.className =
            'unit';


        const title =
            document.createElement('div');

        title.className =
            'unit-title';

        title.textContent =
            unitName;


        unit.appendChild(title);


        if (Array.isArray(lessons)) {

            lessons.forEach(lesson => {

                const row =
                    document.createElement('label');

                row.className =
                    'lesson-item';


                const checkbox =
                    document.createElement('input');

                checkbox.type =
                    'checkbox';

                checkbox.className =
                    'lesson-check';

                checkbox.value =
                    lesson;

                checkbox.dataset.unit =
                    unitName;


                const text =
                    document.createElement('span');

                text.textContent =
                    lesson;


                row.appendChild(checkbox);

                row.appendChild(text);

                unit.appendChild(row);

            });

        }


        box.appendChild(unit);

    });

}


/* ==========================================
   إنشاء الأسئلة
========================================== */

async function generateQuestions() {

    const stage =
        getStage();

    const grade =
        document.getElementById('grade').value;

    const track =
        document.getElementById('track').value;

    const term =
        document.getElementById('term').value;

    const subject =
        document.getElementById('subject').value;

    const documentType =
        document.getElementById('documentType').value;


    const selectedLessonElements =
        [
            ...document.querySelectorAll(
                '.lesson-check:checked'
            )
        ];


    const lessons =
        selectedLessonElements.map(
            item => item.value
        );


    const lessonDetails =
        selectedLessonElements.map(
            item => ({
                lesson: item.value,
                unit: item.dataset.unit || ''
            })
        );


    const counts = {

        mcq:
            Math.max(
                0,
                Number(
                    document.getElementById('mcq').value || 0
                )
            ),

        tf:
            Math.max(
                0,
                Number(
                    document.getElementById('tf').value || 0
                )
            ),

        fill:
            Math.max(
                0,
                Number(
                    document.getElementById('fill').value || 0
                )
            ),

        match:
            Math.max(
                0,
                Number(
                    document.getElementById('match').value || 0
                )
            ),

        imageMatch:
            Math.max(
                0,
                Number(
                    document.getElementById('imageMatch').value || 0
                )
            )

    };


    if (
        !stage ||
        !grade ||
        !term ||
        !subject
    ) {

        alert(
            'يرجى اختيار المرحلة والصف والفصل والمادة.'
        );

        return;

    }


    if (
        stage === 'ثانوي' &&
        isSecondaryTrackGrade(grade) &&
        !track
    ) {

        alert(
            'يرجى اختيار المسار.'
        );

        return;

    }


    if (lessons.length === 0) {

        alert(
            'يرجى اختيار درس واحد على الأقل.'
        );

        return;

    }


    const totalQuestions =
        counts.mcq +
        counts.tf +
        counts.fill +
        counts.match +
        counts.imageMatch;


    if (
        documentType !== 'ملخص' &&
        totalQuestions === 0
    ) {

        alert(
            'يرجى تحديد عدد سؤال واحد على الأقل.'
        );

        return;

    }


    const loading =
        document.getElementById('loading');


    loading.style.display =
        'block';


    try {

        const response =
            await fetch(
                '/api/generate',
                {
                    method: 'POST',

                    headers: {
                        'Content-Type':
                            'application/json'
                    },

                    body: JSON.stringify({

                        stage,
                        grade,
                        track,
                        term,
                        subject,
                        documentType,
                        lessons,
                        lessonDetails,
                        counts

                    })
                }
            );


        if (!response.ok) {

            throw new Error(
                'فشل إنشاء الأسئلة'
            );

        }


        const data =
            await response.json();


        generatedQuestions =
            data.questions || [];


        showPreview(
            generatedQuestions,
            {
                stage,
                grade,
                track,
                term,
                subject,
                documentType
            }
        );


    } catch (error) {

        alert(
            'حدث خطأ أثناء إنشاء الأسئلة.'
        );

        console.error(error);

    } finally {

        loading.style.display =
            'none';

    }

}


/* ==========================================
   عرض المعاينة
========================================== */

function showPreview(
    questions,
    meta
) {

    const card =
        document.getElementById('previewCard');

    const preview =
        document.getElementById('preview');


    const title =
        document.getElementById('title').value ||
        'مستند تعليمي';


    let html = '';


    html += `
        <h1 style="text-align:center">
            ${escapeHtml(title)}
        </h1>
    `;


    html += `
        <p>
            <strong>المرحلة:</strong>
            ${escapeHtml(meta.stage)}

            &nbsp;&nbsp;

            <strong>الصف:</strong>
            ${escapeHtml(meta.grade)}
        </p>
    `;


    if (meta.track) {

        html += `
            <p>
                <strong>المسار:</strong>
                ${escapeHtml(meta.track)}
            </p>
        `;

    }


    html += `
        <p>

            <strong>المادة:</strong>
            ${escapeHtml(
                cleanSubjectName(meta.subject)
            )}

            &nbsp;&nbsp;

            <strong>
                ${escapeHtml(meta.term)}
            </strong>

        </p>
    `;


    html += `
        <p>
            <strong>نوع المستند:</strong>
            ${escapeHtml(meta.documentType)}
        </p>
    `;


    html += `
        <div class="student-line">
            اسم الطالب/ـة:
            ________________________________
        </div>
    `;


    if (!questions.length) {

        html += `
            <div class="empty">
                لم يتم إنشاء أسئلة.
            </div>
        `;

    }


    questions.forEach(
        (q, index) => {

            const number =
                q.n || index + 1;

            html += `
                <div class="question">

                    <div class="question-text">

                        ${number}.
                        ${escapeHtml(q.text || '')}

                    </div>
            `;


            if (
                Array.isArray(q.options) &&
                q.options.length
            ) {

                html += `
                    <div class="options">
                `;


                q.options.forEach(
                    option => {

                        html += `
                            <div>
                                ${escapeHtml(option)}
                            </div>
                        `;

                    }
                );


                html += `
                    </div>
                `;

            }


            html += `
                </div>
            `;

        }
    );


    preview.innerHTML =
        html;


    card.style.display =
        'block';


    card.scrollIntoView({
        behavior: 'smooth'
    });

}


/* ==========================================
   حماية النصوص داخل المعاينة
========================================== */

function escapeHtml(value) {

    return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');

}


/* ==========================================
   التصدير
========================================== */

async function exportDocument(format) {

    if (!generatedQuestions.length) {

        alert(
            'قم بإنشاء الأسئلة أولاً.'
        );

        return;

    }


    const track =
        document.getElementById('track').value;


    const meta = {

        title:
            document.getElementById('title').value,

        documentType:
            document.getElementById('documentType').value,

        stage:
            getStage(),

        grade:
            document.getElementById('grade').value,

        track:
            track,

        term:
            document.getElementById('term').value,

        subject:
            document.getElementById('subject').value,

        teacher:
            document.getElementById('teacher').value,

        school:
            document.getElementById('school').value

    };


    try {

        const response =
            await fetch(
                '/api/export',
                {
                    method: 'POST',

                    headers: {
                        'Content-Type':
                            'application/json'
                    },

                    body: JSON.stringify({

                        questions:
                            generatedQuestions,

                        meta,

                        format

                    })
                }
            );


        if (!response.ok) {

            throw new Error(
                'فشل تصدير المستند'
            );

        }


        const blob =
            await response.blob();


        const url =
            window.URL.createObjectURL(
                blob
            );


        const a =
            document.createElement('a');


        a.href =
            url;


        a.download =
            format === 'docx'
                ? 'المستند.docx'
                : format === 'pdf'
                    ? 'المستند.pdf'
                    : 'المستندات.zip';


        document.body.appendChild(a);


        a.click();


        a.remove();


        window.URL.revokeObjectURL(
            url
        );


    } catch (error) {

        alert(
            'حدث خطأ أثناء تصدير المستند.'
        );

        console.error(error);

    }

}
